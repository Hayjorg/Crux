<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crux tests</title>
<!-- Dev-only regression tests for crux.html. Not part of the app and never published.
     Open http://localhost:8765/dev/tests.html (any static server works). It loads the real
     ../crux.html in a frame whose localStorage is an in-memory stand-in, so the save in this
     browser is never read or written. Results: the page, document.title, and window.cruxTestResults. -->
<style>
  body{margin:0;padding:16px;font:14px system-ui,sans-serif;background:#F3EEE2;color:#221E19;}
  h1{font-size:18px;margin:0 0 4px;} p{margin:0 0 10px;color:#6d655a;max-width:820px;}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0 14px;}
  button{font:inherit;padding:8px 14px;border-radius:999px;border:1px solid #cdbf9f;background:#fff;cursor:pointer;}
  #summary{font-weight:700;}
  .layout{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;}
  #results{flex:1;min-width:300px;list-style:none;margin:0;padding:0;}
  #results li{background:#fff;border:1px solid #E3DAC5;border-radius:10px;padding:8px 10px;margin-bottom:6px;}
  #results .name{font-weight:600;} #results .detail{color:#6d655a;font-size:12.5px;white-space:pre-wrap;margin-top:3px;}
  .pass .tag{color:#1f8a4c;} .fail .tag{color:#c0392b;} .warn .tag{color:#b7791f;} .run .tag{color:#6d655a;}
  .fail{border-color:#e8a59d !important;} .warn{border-color:#efd29a !important;}
  iframe{width:390px;height:760px;border:1px solid #E3DAC5;border-radius:12px;background:#fff;}
</style></head><body>
<h1>Crux tests</h1>
<p>Checks the things that must never break: logging, sessions, saved data, old saves and backups,
and the project rules. It runs on its own private copy of the data, never your real save. Takes about a minute.</p>
<div class="bar"><button id="runBtn">Run again</button><span id="summary">Starting…</span></div>
<div class="layout"><ul id="results"></ul><iframe id="app" title="App under test"></iframe></div>
<script src="route-bot.js"></script>
<script>
(function(){
  var KEY = "crux-app-state-v2";
  var STORE = {};                 // what the app under test sees as localStorage
  window.__cruxStore = STORE;
  window.__appErrors = [];
  var SRC = null, W = null, D = null, TEMPLATE = null;
  var results = [];
  window.cruxTestResults = results;

  var SHIM = '<base href="/"><script>(function(){window.__cruxTest=true;var S=parent.__cruxStore;' +
    'var ls={getItem:function(k){if(parent.__fault&&parent.__fault.get)throw new Error("fault: read");return Object.prototype.hasOwnProperty.call(S,k)?S[k]:null;},setItem:function(k,v){if(parent.__fault&&parent.__fault.set)throw new Error("QuotaExceededError");S[k]=String(v);},' +
    'removeItem:function(k){delete S[k];},clear:function(){Object.keys(S).forEach(function(k){delete S[k];});},' +
    'key:function(i){return Object.keys(S)[i]||null;},get length(){return Object.keys(S).length;}};' +
    'Object.defineProperty(window,"localStorage",{configurable:true,get:function(){return ls;}});' +
    'window.addEventListener("error",function(e){parent.__appErrors.push("error: "+e.message);});' +
    'window.addEventListener("unhandledrejection",function(e){parent.__appErrors.push("rejection: "+(e.reason&&e.reason.message||e.reason));});' +
    'if(parent.__fakeClaude){var F=parent.__fakeClaude;window.claude={use:function(n){return Promise.resolve(n==="sample"?F:null);}};}' +
    'var ce=console.error;console.error=function(){parent.__appErrors.push("console.error: "+[].map.call(arguments,String).join(" "));ce.apply(console,arguments);};' +
    '})();<\/script>';

  /* ---------- harness ---------- */
  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function $(id){ var el = D.getElementById(id); if(!el) throw new Error("missing #"+id); return el; }
  function q(sel){ return D.querySelector(sel); }
  function qa(sel){ return Array.prototype.slice.call(D.querySelectorAll(sel)); }
  function visible(id){ var el = D.getElementById(id); return !!el && !el.hidden && !el.closest("[hidden]"); }
  async function click(el, ms){ if(typeof el==="string") el = $(el); el.click(); await wait(ms==null ? 150 : ms); }
  function fire(el, type){ el.dispatchEvent(new W.Event(type, { bubbles:true })); }
  async function type(el, value){ el.value = value; fire(el, "input"); await wait(450); }
  async function setGym(el, value){ fire(el, "focus"); el.value = value; fire(el, "input"); await wait(450); fire(el, "change"); await wait(100); }
  function saved(){ return JSON.parse(STORE[KEY] || "null"); }
  function active(s){ s = s || saved(); return s.sessions.find(function(x){ return x.id===s.activeSessionId; }); }
  function where(s, id){ var p = (s.projects||[]).find(function(p){ return p.id===id; }); return p ? p.name+"@"+(p.location||"(not set)") : "none"; }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function sameExceptProject(a, b){ var x = clone(a), y = clone(b); delete x.projectId; delete y.projectId; return JSON.stringify(x)===JSON.stringify(y); }

  // Boots a fresh copy of the app on whatever is in STORE (pass a state to replace it first).
  // `launch` stands in for the address the app was opened with (e.g. "?log=send"): the test frame can't change its own.
  async function boot(seed, launch){
    if(seed!==undefined){ Object.keys(STORE).forEach(function(k){ delete STORE[k]; }); if(seed) STORE[KEY] = JSON.stringify(seed); }
    var frame = document.getElementById("app");
    await new Promise(function(resolve){
      frame.onload = resolve;
      var i = SRC.search(/<meta charset[^>]*>/i);
      var at = i<0 ? 0 : i + SRC.match(/<meta charset[^>]*>/i)[0].length;
      var hint = launch ? '<script>window.__cruxLaunch=' + JSON.stringify(launch) + ';<\/script>' : '';
      frame.srcdoc = SRC.slice(0, at) + SHIM + hint + SRC.slice(at);
    });
    W = frame.contentWindow; D = frame.contentDocument;
    await wait(350);
    if(W.localStorage instanceof W.Storage) throw new Error("storage stand-in not installed: the real save would be used");
  }
  async function ackSafety(){ if(visible("legalOverlay") && visible("legalAckBtn")) await click("legalAckBtn"); }
  async function goHome(){ if(!D.getElementById("view-session").hidden) await click("sessionHomeBtn"); if(!D.getElementById("view-detail").hidden) await click("backFromDetailBtn"); if(!D.getElementById("view-train").hidden) await click("navHomeBtn"); }
  // Workouts live in the Train area now (the bottom bar's Train tab), not on the Home dock.
  async function toTrain(){ await goHome(); await click("navTrainBtn", 150); }
  async function startOrResume(){ await goHome(); await click("startSessionBtn", 250); }
  async function log(kind, name){
    await click("log"+kind[0].toUpperCase()+kind.slice(1), 200);
    if(name!=null){ await type($("composerClimbName"), name); }
  }
  async function closeComposer(){ var b = D.getElementById("composerDone"); if(b){ b.click(); await wait(320); } }
  async function setMode(mode){
    await goHome(); await click("openSettingsBtn");
    await click(q('#modeRow [data-mode-val="'+mode+'"]'));
    await click("closeSettingsBtn");
  }
  async function exportJson(){
    await goHome(); await click("openSettingsBtn"); await click("exportBackupBtn", 250);
    var json = $("exportFallbackText").value; await click("closeSettingsBtn"); return json;
  }
  async function importText(text, confirm){
    await goHome(); await click("openSettingsBtn");
    var inp = $("importBackupInput"), dt = new W.DataTransfer();
    dt.items.add(new W.File([text], "backup.json", { type:"application/json" }));
    inp.files = dt.files; fire(inp, "change"); await wait(300);
    var msg = visible("importConfirm") ? $("importConfirmText").textContent : "";
    if(msg) await click(confirm===false ? "importCancelBtn" : "importConfirmBtn", 300);
    if(visible("settingsOverlay")) await click("closeSettingsBtn");
    return msg;
  }

  /* ---------- fixtures ---------- */
  // A save from before projects existed: same-name climbs at two gyms, one with no gym,
  // plus notes, photos, grades and efforts that must survive untouched.
  function oldFormatSave(){
    var s = clone(TEMPLATE), D_ = 86400000, now = Date.now(), seq = 0;
    function att(r, name, ts, extra){ seq++; return Object.assign({ id:"a"+seq, result:r, xp:r==="flash"?30:r==="send"?20:5, ts:ts, seq:seq, effort:null, reason:null, note:"", gradeType:"boulder", grade:null, photos:[], climbName:name }, extra||{}); }
    function sess(id, loc, day, atts){ return { id:id, startedAt:now-day*D_, endedAt:now-day*D_+3600000, timerConfig:{ workSec:45, restSec:90 }, attempts:atts.reverse(), note:"session "+id, photos:[], satisfaction:null, location:loc }; }
    s.sessions = [
      sess("s4", "", 3, [att("fall", "Crimp", now-3*D_, { note:"left sloper", photos:[{ id:"ph1", kind:"image" }] })]),
      sess("s3", "Mesa Rim", 5, [att("fall", "Roof", now-5*D_, { grade:"V5" }), att("send", "Blue Arete", now-5*D_+9000, { grade:"V3" })]),
      sess("s2", "Movement", 8, [att("fall", "Pink Slab", now-8*D_, { grade:"V2", effort:6 })]),
      sess("s1", "Movement", 10, [att("fall", "Blue Arete", now-10*D_, { grade:"V4", note:"heel hook on the lip", effort:7, reason:"Pumped" }), att("fall", "Blue Arete", now-10*D_+5000)])
    ];
    s.seq = seq; s.activeSessionId = null; s.lastLocation = "Movement";
    s.settings.mode = "advanced"; s.settings.askClimbName = true; s.settings.ackSafety = Date.now();
    delete s.projects;
    return s;
  }
  function allAttempts(s){ var out = []; s.sessions.forEach(function(x){ x.attempts.forEach(function(a){ out.push(a); }); }); return out; }

  /* ---------- tests ---------- */
  var TESTS = [];
  function test(name, fn){ TESTS.push({ name:name, fn:fn }); }
  function expect(cond, msg){ if(!cond) throw new Error(msg); }
  function warn(msg){ var e = new Error(msg); e.warn = true; throw e; }

  test("Fresh install starts cleanly and shows the safety notice once", async function(){
    await boot(null);
    expect(!D.getElementById("view-home").hidden, "home screen isn't showing");
    expect(visible("legalOverlay"), "first-run safety notice didn't appear");
    await ackSafety();
    expect(!visible("legalOverlay"), "notice didn't close after 'I understand'");
    expect(saved() && saved().settings.ackSafety, "acknowledgement wasn't saved");
    TEMPLATE = saved();
    await boot();
    expect(!visible("legalOverlay"), "notice came back after reload");
  });

  test("Saves only under the crux-app-state-v2 key", async function(){
    await boot(TEMPLATE); await startOrResume(); await log("send");
    var keys = Object.keys(STORE);
    expect(keys.indexOf(KEY)>=0, "nothing saved under "+KEY);
    var other = keys.filter(function(k){ return k!==KEY; });
    expect(!other.some(function(k){ return /crux|crimpet|state/i.test(k); }), "app also saves under: "+other.join(", "));
  });

  test("Logging Flash, Send and Fall saves attempts, XP and counts", async function(){
    await boot(TEMPLATE); await startOrResume();
    await log("flash"); await log("send"); await log("fall");
    var s = saved(), a = active(s);
    expect(a, "no active session saved");
    expect(a.attempts.map(function(x){ return x.result; }).join()==="fall,send,flash", "attempts saved as "+a.attempts.map(function(x){ return x.result; }).join());
    expect(s.counts.flash===1 && s.counts.send===1 && s.counts.fall===1, "counts are "+JSON.stringify(s.counts));
    expect(s.totalAttempts===3, "totalAttempts is "+s.totalAttempts);
    var xpSum = a.attempts.reduce(function(n, x){ return n+x.xp; }, 0);
    expect(xpSum===55, "attempt XP adds up to "+xpSum+", expected 30+20+5");
  });

  test("A refresh keeps you on the screen you were on (Train, Wall), with safe fallbacks", async function(){
    await boot(TEMPLATE);
    expect(!D.getElementById("view-home").hidden, "a save with no lastView should open on Home");
    await click("navTrainBtn", 250);
    expect(saved().lastView && saved().lastView.v==="train", "Train wasn't remembered: "+JSON.stringify(saved().lastView));
    await boot();
    expect(!D.getElementById("view-train").hidden && D.getElementById("view-home").hidden, "refresh on Train didn't stay on Train");
    await boot(Object.assign(clone(TEMPLATE), { lastView:{ v:"wall", id:null } }));
    expect(!D.getElementById("view-wall").hidden, "refresh on the Wall didn't stay on the Wall");
    await boot(Object.assign(clone(TEMPLATE), { lastView:{ v:"session", id:null } }));
    expect(!D.getElementById("view-home").hidden, "a remembered session with none running should fall back to Home");
    await boot(Object.assign(clone(TEMPLATE), { lastView:{ v:"detail", id:"nope" } }));
    expect(!D.getElementById("view-home").hidden, "a remembered detail for a missing session should fall back to Home");
    await boot(Object.assign(clone(TEMPLATE), { lastView:"garbage" }));
    expect(!D.getElementById("view-home").hidden && saved().lastView!=="garbage", "a malformed lastView should be ignored");
    await boot(TEMPLATE); await startOrResume(); await log("send");
    await click("sessionHomeBtn", 250);
    await boot();
    expect(!D.getElementById("view-home").hidden, "with a session running, a refresh on Home should stay on Home");
    await boot(Object.assign(clone(saved()), { lastView:null }));
    expect(!D.getElementById("view-session").hidden, "no remembered view + a running session should still open the session");
  });

  test("Quick log: the home-screen shortcuts (?log=send / flash / fall) log once, start a session if needed, and a reload doesn't log again", async function(){
    await boot(TEMPLATE, "?log=send");
    var a = active(saved());
    expect(a, "the shortcut didn't start a session");
    expect(a.attempts.length===1 && a.attempts[0].result==="send", "expected one send, saw "+a.attempts.map(function(x){ return x.result; }).join());
    expect(!D.getElementById("view-session").hidden, "the session screen isn't showing");
    expect(saved().counts.send===1 && saved().xp>0, "XP/counts weren't updated: "+JSON.stringify(saved().counts));
    await boot();                       // a plain reload: the cleaned address carries no ?log=
    expect(active(saved()).attempts.length===1, "a reload logged a second attempt");
    await boot(undefined, "?x=1&log=flash&y=2"); // joins the running session, and other address parts don't matter
    await boot(undefined, "?log=fall");
    expect(active(saved()).attempts.map(function(x){ return x.result; }).join()==="fall,flash,send", "attempts are "+active(saved()).attempts.map(function(x){ return x.result; }).join());
    expect(saved().sessions.length===1, "a second session was started instead of joining the running one");
    var undo = qa("#toastStack .toast-action").pop();
    expect(undo, "no Undo button on the quick-log toast");
    await click(undo, 250);
    expect(active(saved()).attempts.length===2, "Undo didn't remove the quick-logged attempt");
    await boot(undefined, "?log=bogus");  // anything else is ignored
    await boot(undefined, "?logs=send");
    expect(active(saved()).attempts.length===2, "an unknown ?log= value logged something");
    await boot(null, "?log=send");        // brand-new install: the safety notice first, nothing logged behind it
    expect(visible("legalOverlay"), "first-run notice didn't show");
    expect(!saved() || !saved().sessions.length, "a first-run shortcut logged behind the safety notice");
  });

  test("Undo on the log toast removes that attempt and its XP", async function(){
    await boot(TEMPLATE); await startOrResume(); await log("flash");
    var before = saved(); await log("send");
    var undo = qa("#toastStack .toast-action").pop();
    expect(undo, "no Undo button on the toast");
    await click(undo, 250);
    var after = saved();
    expect(active(after).attempts.length===1, "session has "+active(after).attempts.length+" attempts after undo");
    expect(after.xp===before.xp && after.level===before.level, "XP/level not restored: "+[after.level, after.xp]+" vs "+[before.level, before.xp]);
  });

  test("A running session survives a reload and Finish ends it", async function(){
    await boot(TEMPLATE); await startOrResume(); await log("send"); await log("fall");
    var id = saved().activeSessionId;
    await boot();
    expect(saved().activeSessionId===id, "active session lost on reload");
    expect(!D.getElementById("view-session").hidden, "reload didn't reopen the running session");
    await goHome();
    expect(/Resume/i.test($("startSessionBtn").textContent), "home doesn't offer Resume Session");
    await startOrResume();
    await click("finishSessionBtn", 300);
    var s = saved(), done = s.sessions.find(function(x){ return x.id===id; });
    expect(!s.activeSessionId, "session still active after Finish");
    expect(done && done.endedAt && done.attempts.length===2, "finished session not saved with its 2 attempts");
    expect(visible("endSessionOverlay"), "end summary didn't show");
    await click("endSummaryDoneBtn", 200);
    expect(q('#historyList .session-card[data-id="'+id+'"]'), "finished session missing from history");
  });

  test("An old save (before projects) loads with every attempt detail unchanged", async function(){
    var old = oldFormatSave(); await boot(old); await goHome();
    var s = saved() || old; // the app may not re-save until something changes
    await click("openSettingsBtn"); await click("closeSettingsBtn"); s = saved();
    var oldA = allAttempts(old), newA = allAttempts(s);
    expect(newA.length===oldA.length, newA.length+" attempts after load, expected "+oldA.length);
    var changed = oldA.filter(function(a){ var n = newA.find(function(x){ return x.id===a.id; }); return !n || !sameExceptProject(a, n); });
    expect(!changed.length, "attempts changed by migration: "+changed.map(function(a){ return a.id; }).join());
    expect(s.totalAttempts===oldA.length, "profile counts "+s.totalAttempts+" attempts");
  });

  test("Same-name climbs at different gyms stay separate; no-gym entries aren't merged", async function(){
    await boot(oldFormatSave()); await click("openSettingsBtn"); await click("closeSettingsBtn");
    var s = saved(), names = s.projects.map(function(p){ return p.name+"@"+(p.location||"(not set)"); }).sort();
    var want = ["Blue Arete@Mesa Rim", "Blue Arete@Movement", "Crimp@(not set)", "Pink Slab@Movement", "Roof@Mesa Rim"];
    expect(JSON.stringify(names)===JSON.stringify(want), "projects are "+names.join(", "));
    var s1 = s.sessions.find(function(x){ return x.id==="s1"; });
    expect(s1.attempts.every(function(a){ return where(s, a.projectId)==="Blue Arete@Movement"; }), "Movement Blue Arete attempts not on one project");
  });

  test("Very old saves (before sessions existed) still load", async function(){
    var now = Date.now();
    await boot({ xp:40, level:1, attempts:[{ id:"x1", result:"send", xp:20, ts:now-5000 }, { id:"x2", result:"fall", xp:5, ts:now-9000 }] });
    await ackSafety(); await click("openSettingsBtn"); await click("closeSettingsBtn");
    var s = saved();
    expect(s && s.sessions.length===1 && s.sessions[0].attempts.length===2, "legacy attempts not kept: "+JSON.stringify(s && s.sessions.map(function(x){ return x.attempts.length; })));
    expect(s.totalAttempts===2, "totalAttempts is "+s.totalAttempts);
  });

  test("Backup export then import gives back identical data", async function(){
    await boot(oldFormatSave()); await startOrResume(); await log("flash"); await closeComposer();
    var json = await exportJson();
    var wrapped = JSON.parse(json);
    expect(wrapped.kind==="crux-backup" && wrapped.data && Array.isArray(wrapped.data.sessions), "export isn't a crux-backup file");
    var before = STORE[KEY];
    var msg = await importText(json);
    expect(/Replace everything/.test(msg), "no import confirmation shown");
    // lastView is just where you were on screen (the test itself goes Home to import), not user data
    function noView(t){ var o = JSON.parse(t); delete o.lastView; return JSON.stringify(o); }
    expect(noView(STORE[KEY])===noView(before), "data changed after importing its own backup");
  });

  test("Old-format and raw backups import, with details kept", async function(){
    var old = oldFormatSave();
    await boot(TEMPLATE);
    var msg = await importText(JSON.stringify({ kind:"crux-backup", version:1, exportedAt:new Date().toISOString(), data:old }));
    expect(/4 sessions, 6 attempts/.test(msg), "confirm text: "+msg);
    var s = saved(), oldA = allAttempts(old);
    expect(oldA.every(function(a){ var n = allAttempts(s).find(function(x){ return x.id===a.id; }); return n && sameExceptProject(a, n); }), "attempt details changed on old-format import");
    expect(s.projects.length===5, "old-format import made "+s.projects.length+" projects, expected 5");
    await importText(JSON.stringify(old));
    expect(saved().projects.length===5 && allAttempts(saved()).length===oldA.length, "raw saved-state import failed");
  });

  test("A file that isn't a backup is rejected; Cancel changes nothing", async function(){
    await boot(oldFormatSave()); await click("openSettingsBtn"); await click("closeSettingsBtn");
    var before = STORE[KEY];
    var msg = await importText("{}");
    expect(!msg, "an empty object was offered for import");
    expect(STORE[KEY]===before, "data changed after a rejected file");
    await importText(JSON.stringify(TEMPLATE), false);
    expect(STORE[KEY]===before, "data changed after Cancel");
  });

  test("Continue with no session starts one at the project's gym with it picked", async function(){
    await boot(oldFormatSave()); await goHome();
    await click("openProgressBtn");
    var row = qa("#projectsList .project-row-btn").find(function(b){ return /Pink Slab/.test(b.textContent); });
    expect(row, "Pink Slab not in the Projects list"); await click(row);
    var cont = q(".project-continue-btn"); expect(cont, "no Continue button on an unfinished project");
    await click(cont, 300);
    var s = saved(), a = active(s);
    expect(a, "no session started");
    expect(a.location==="Movement", "session gym is '"+a.location+"'");
    expect(where(s, a.projectId)==="Pink Slab@Movement", "picked project is "+where(s, a.projectId));
    await log("fall"); await closeComposer();
    s = saved(); a = active(s);
    expect(a.attempts[0].climbName==="Pink Slab" && where(s, a.attempts[0].projectId)==="Pink Slab@Movement", "next go not logged to Pink Slab");
  });

  test("Continue with a session running reuses it", async function(){
    await boot(oldFormatSave()); await startOrResume(); await log("fall"); await closeComposer();
    var id = saved().activeSessionId, n = saved().sessions.length;
    await goHome(); await click("openProgressBtn");
    await click(qa("#projectsList .project-row-btn").find(function(b){ return /Blue Arete/.test(b.textContent) && /Movement/.test(b.textContent); }));
    await click(q(".project-continue-btn"), 300);
    var s = saved();
    expect(s.activeSessionId===id, "a different session became active");
    expect(s.sessions.length===n, "session count went "+n+" → "+s.sessions.length);
    expect(where(s, active(s).projectId)==="Blue Arete@Movement", "picked "+where(s, active(s).projectId));
  });

  test("Switching projects doesn't relabel earlier attempts; the pick survives reload", async function(){
    await boot(oldFormatSave()); await startOrResume();
    var chip = function(re){ return qa(".project-chip").find(function(b){ return re.test(b.textContent); }); };
    expect(chip(/Blue Arete/), "no project chips in the session");
    await click(chip(/Blue Arete/)); await log("fall"); await closeComposer(); await log("fall"); await closeComposer();
    var earlier = clone(active().attempts);
    await click(chip(/Pink Slab/)); await log("send"); await closeComposer();
    var s = saved(), a = active(s);
    expect(JSON.stringify(a.attempts.slice(1))===JSON.stringify(earlier), "earlier attempts changed after switching");
    expect(where(s, a.attempts[0].projectId)==="Pink Slab@Movement", "new go logged to "+where(s, a.attempts[0].projectId));
    await boot();
    expect(where(saved(), active().projectId)==="Pink Slab@Movement", "pick lost on reload");
    await startOrResume();
    var sel = qa(".project-chip.selected").map(function(b){ return b.textContent; });
    expect(sel.length===1 && /Pink Slab/.test(sel[0]), "selected chip after reload: "+sel.join());
  });

  test("Typed names only auto-join the same name at the same gym; unknown gyms ask first", async function(){
    await boot(oldFormatSave()); await startOrResume(); // session at Movement
    await log("fall", "blue arete");
    var s = saved();
    expect(where(s, active(s).attempts[0].projectId)==="Blue Arete@Movement", "same gym went to "+where(s, active(s).attempts[0].projectId));
    expect(!q("#composerProjectHint .pc-use"), "asked a question for a same-gym match");
    await closeComposer();

  test("Timer builder: compileTimerConfig phases, totals, lead-in and no trailing rest", async function(){
    await boot(workoutSave());
    var C = W.__cruxTimer.compile;
    function total(p){ return p.reduce(function(n, x){ return n + x.ms; }, 0); }
    // 6 reps x 7/3, 3 sets, 60 s set rest, 10 s get ready
    var p = C({ work:7, reps:6, repRest:3, sets:3, setRest:60, leadIn:10 });
    expect(p.length===36 && total(p)===301000, "repeaters: "+p.length+" phases, "+total(p)+" ms");
    expect(p[0].kind==="rest" && p[0].label==="GET READY" && p[0].ms===10000, "lead-in is not phase 0: "+JSON.stringify(p[0]));
    expect(p[p.length-1].kind==="work" && p[p.length-1].tag==="REP 6/6 \u00b7 SET 3/3", "ends on: "+JSON.stringify(p[p.length-1]));
    expect(p[1].tag==="REP 1/6 \u00b7 SET 1/3" && p[1].label==="WORK", "first rep: "+JSON.stringify(p[1]));
    var sr = p.filter(function(x){ return x.label==="SET REST"; });
    expect(sr.length===2 && sr.every(function(x){ return x.ms===60000; }), "set rests: "+sr.length);
    var i6 = p.findIndex(function(x){ return x.tag==="REP 6/6 \u00b7 SET 1/3" && x.kind==="work"; });
    expect(p[i6+1].label==="SET REST" && p[i6+2].tag==="REP 1/6 \u00b7 SET 2/3", "set rest doesn't replace the rep rest");
    // 4x4s: 4 reps of 240/240, one set
    p = C({ work:240, reps:4, repRest:240, sets:1, setRest:0, leadIn:10 });
    expect(p.length===8 && total(p)===10000+4*240000+3*240000 && p[p.length-1].kind==="work", "4x4s: "+p.length+", "+total(p));
    // 10/50 x6
    p = C({ work:10, reps:6, repRest:50, sets:1, setRest:0, leadIn:10 });
    expect(p.length===12 && total(p)===10000+60000+250000 && p[p.length-1].kind==="work", "10/50: "+p.length+", "+total(p));
    // no lead-in, and clamping
    p = C({ work:10, reps:2, repRest:5, sets:1, setRest:0, leadIn:0 });
    expect(p.length===3 && p[0].kind==="work", "leadIn 0 should add no phase");
    p = C({ work:1, reps:500, repRest:5000, sets:-3, setRest:0, leadIn:10 });
    expect(p[1].ms===3000 && p.filter(function(x){ return x.kind==="work"; }).length===99 && p[2].ms===1800000, "clamp: "+JSON.stringify(p.slice(0, 3)));
    expect(C({}).length>=1 && C(null).length>=1, "garbage in gave no program");
  });

  // ---- The Wall (removable feature) ----
  // spec: [{daysAgo, workout?}] -> sessions with one logged go (or one finished workout step)
  function wallSave(specs, extra){
    var s = clone(TEMPLATE), now = Date.now(), seq = 0;
    s.sessions = specs.map(function(sp, i){
      var start = now - sp.daysAgo*86400000, ses = { id:"w"+i, startedAt:start, endedAt:start+60000, timerConfig:{ workSec:45, restSec:90 }, attempts:[], note:"", photos:[], satisfaction:null, location:"" };
      if(sp.workout) ses.workout = { source:{ kind:"example", id:"ex-4x4" }, doc:{ v:1, title:"4x4s", steps:[{ id:"s1", type:"instruction", title:"Go" }] }, index:1, steps:{ s1:{ status:"done" } }, startedAt:start, result:{ rpe:null, note:"" } };
      else { seq++; ses.attempts = [{ id:"wa"+seq, result:"send", xp:20, ts:start+1, seq:seq, effort:null, reason:null, note:"", gradeType:"boulder", grade:null, photos:[], climbName:"" }]; }
      return ses;
    });
    s.seq = seq; s.activeSessionId = null;
    return Object.assign(s, extra||{});
  }

    function pool(t, lo, hi){ var tr = 0, ps = 0; for(var n=lo;n<=hi;n++){ var e = t.byN[n]; if(e){ tr += e.tries; ps += e.passes; } } return tr ? ps/tr : -1; }

    var rep = "beg early "+pool(beg, 4, 5).toFixed(2)+" avg mid "+pool(avg, 6, 7).toFixed(2)+" avg top "+pool(avg, 8, 10).toFixed(2)+" str peak "+pool(str, 9, 10).toFixed(2);

  test("Dyno: a human-like bot misses items (beginner < average < strong), none is flawless, and a perfect player has a real ceiling", async function(){
    var seed = clone(TEMPLATE); seed.settings.ackSafety = Date.now();
    await boot(seed); await goHome();
    var G = W.__cruxGames;
    function gauss(r){ var u = 0, v = 0; while(!u) u = r(); while(!v) v = r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
    var BANDS = { beginner:{ sigma:140, bias:60, lapse:0.08, antic:0 }, average:{ sigma:90, bias:25, lapse:0.05, antic:0.4 }, strong:{ sigma:50, bias:0, lapse:0.03, antic:0.45 } };
    function pol(band, seed){
      var b = BANDS[band], r = G.mulberry32(seed*7919+13);
      return function(spec, st){
        var prog = Math.min(1, st.jumps*1900/45000), lat = (180+80*r())*(1-b.antic), gap = Math.max(0, 250+80*gauss(r));
        if(r()<b.lapse) return { gap:gap, hold:spec.T*r() };
        return { gap:gap, hold:Math.max(0, G.dynoIdealHold(spec)+b.bias+lat+gauss(r)*b.sigma*(1+0.15*prog)) };
      };
    }
    var rate = {}, mean = {}, perfect = 0;
    Object.keys(BANDS).forEach(function(band){
      var ok = 0, tot = 0, sum = 0;
      for(var s=1;s<=200;s++){
        var p = pol(band, s*31+15);
        for(var k=0;k<20;k++){ var sp = G.dynoSpec(s, 15), h = p(sp, { jumps:15 }).hold; ok += G.dynoJudge(sp, h).kind==="latch" ? 1 : 0; tot++; }
        sum += G.dynoRun(s*977, pol(band, s)).peak;
      }
      rate[band] = ok/tot; mean[band] = sum/200;
    });
    for(var s2=1;s2<=200;s2++) perfect += G.dynoRun(s2*977, function(sp){ return G.dynoIdealHold(sp); }).peak;
    perfect /= 200;
    expect(rate.beginner>0.25 && rate.beginner<0.60, "beginner at the hardest hold: "+rate.beginner);
    expect(rate.average>0.45 && rate.average<0.78, "average at the hardest hold: "+rate.average);
    expect(rate.strong>0.75 && rate.strong<0.97, "strong at the hardest hold: "+rate.strong);
    expect(mean.beginner<mean.average && mean.average<mean.strong && mean.strong<perfect, "skill ordering: "+JSON.stringify(mean)+" perfect "+perfect);
    expect(perfect-mean.strong>=3, "no ceiling above a strong player: "+perfect+" vs "+mean.strong);
  });

  test("Games: Wall Run property, 500 seeds always solvable, fair lane changes, reaction window >= 400 ms at top speed, a null player scores 0", async function(){
    var seed = clone(TEMPLATE); seed.settings.ackSafety = Date.now();
    await boot(seed); await goHome();
    var G = W.__cruxGames, F = G.WR_FLOOR, R = G.WR_ROUND_MS;
    // difficulty is monotone and plateaus; the hardest window and visible time hold the 400 ms floor
    var prev = G.wallPhase(0), mono = true, minWin = 1e9, minSeen = 1e9;
    for(var t=0;t<=70000;t+=250){
      var ph = G.wallPhase(t);
      if(ph.gap>prev.gap || ph.look>prev.look || ph.half>prev.half || ph.early>prev.early || ph.late>prev.late) mono = false;
      minWin = Math.min(minWin, ph.half*2); minSeen = Math.min(minSeen, ph.look-ph.early); prev = ph;
    }
    expect(mono, "difficulty must not ease off during the round");
    expect(minWin>=400, "tap window dips below 400 ms: "+minWin);
    expect(minSeen>=600, "a hold is visible less than 600 ms before its window opens: "+minSeen);
    var burstsSeen = 0, worstRepeat = 0, minN = 1e9, laneUse = [0, 0, 0], jumpsAtSpeed = 0, nullSlipsOk = true, floorsOk = 0;
    for(var sd=1;sd<=500;sd++){
      var s = sd*7919, notes = G.wallNotes(s), again = G.wallNotes(s);
      expect(JSON.stringify(notes)===JSON.stringify(again), "not seeded, seed "+sd);
      var live = notes.filter(function(n){ return n.due<R; }), run = 1;
      expect(live.length>=50, "round too short: "+live.length+" seed "+sd);
      minN = Math.min(minN, live.length);
      expect(notes[0].due>=2000, "first hold is due too soon");
      for(var i=0;i<notes.length;i++){
        var n = notes[i]; laneUse[n.lane]++;
        expect(n.lane===0 || n.lane===1 || n.lane===2, "bad lane");
        if(i===0) continue;
        var pn = notes[i-1], gap = n.due-pn.due, d = Math.abs(n.lane-pn.lane);
        if(gap<F[d]) floorsOk++;                       // an unfair lane change for the time given
        if(d===2 && n.due>30000) jumpsAtSpeed++;
        if(i>=2 && gap<=F[0]+90 && pn.due-notes[i-2].due<=F[0]+90 && n.due>12000) burstsSeen++;
        run = n.lane===pn.lane ? run+1 : 1; if(run>worstRepeat) worstRepeat = run;
      }
      // perfect play and the three fairest edges of the window are all clean
      [0, 1, -1].forEach(function(e){
        var fair = live.filter(function(n){ return n.due+G.wallLate(n)<R; });   // the round clock ends the last window
        var taps = fair.map(function(n){ return { t:n.due+(e>0 ? G.wallLate(n) : e<0 ? -G.wallEarly(n) : 0), lane:n.lane }; });
        var res = G.wallRound(notes, taps);
        expect(fair.length>=live.length-1 && res.peak===fair.length && res.slips===0 && res.hits===fair.length, "unsolvable edge "+e+" seed "+sd+": "+JSON.stringify([res.peak, res.slips, fair.length]));
      });
      // nobody taps: score 0, one slip per hold, the round still ends (it is a replay to the end)
      var nul = G.wallRound(notes, []);
      if(nul.peak!==0 || nul.hits!==0 || nul.h!==0) nullSlipsOk = false;
      // always 150 ms past the window (it can only land on a later hold of the same lane): most holds are missed
      var offs = G.wallRound(notes, live.map(function(n){ return { t:n.due+G.wallLate(n)+150, lane:n.lane }; }));
      expect(offs.peak<live.length*0.4, "taps outside the window climb too well, seed "+sd+": "+offs.peak+" of "+live.length);
    }
    expect(floorsOk===0, floorsOk+" lane changes were closer than the fair floor");
    expect(worstRepeat<=G.WR_MAX_RUN, "same lane "+worstRepeat+" times in a row");
    expect(nullSlipsOk, "a null player moved");
    expect(laneUse.every(function(c){ return c>0.2*(laneUse[0]+laneUse[1]+laneUse[2]); }), "lanes unevenly used: "+laneUse);
    expect(burstsSeen>=300, "too few quick runs of 3+ holds at the floor spacing: "+burstsSeen);
    expect(jumpsAtSpeed>0, "no across-the-wall jumps late in the round: too easy");
  });

    d = G.stackDrop(8, 96, 40); expect(!d.miss && d.width===96 && d.over===0 && d.shift===40, "at the floor nothing is trimmed, the block sits where it was dropped: "+JSON.stringify(d));
    d = G.stackDrop(8, 96, -47.9); expect(!d.miss && d.width===96 && d.shift===-47.9, "just inside half a width still holds");

    d = G.stackDrop(8, 200, 100); expect(d.miss, "centre off the edge topples even with overlap left");
    d = G.stackDrop(8, 200, 99.9); expect(!d.miss && Math.abs(d.width-100.1)<1e-9, "just inside holds with a thin block: "+JSON.stringify(d));
    d = G.stackDrop(3, 320, 150); expect(!d.miss && d.width===320 && d.shift===0, "learn blocks are forgiven and stay 100%");
    d = G.stackDrop(3, 320, 330); expect(d.miss, "learn block far off the tower still falls");
    // bad input never makes NaN, a zero or negative width, or throws
    [[NaN,NaN,NaN],[0,0,0],[1,0,5],[1,-50,5],[1,1e9,1e9],[1,Infinity,0],[NaN,200,-1e9],[8,96,undefined],[8,null,"x"],[8,5,3]].forEach(function(a){

    expect(G.stackWidth(9, 150, 20)===130 && G.stackScore(7, 3)===10, "stackWidth / stackScore");
    // slider: a deterministic triangle wave in -160..160, edge to edge in one crossing time
    expect(Math.abs(G.stackPos(0, 1500, 0, 1)+160)<1e-9 && Math.abs(G.stackPos(1500, 1500, 0, 1)-160)<1e-9 && Math.abs(G.stackPos(3000, 1500, 0, 1)+160)<1e-9, "edge to edge");
    expect(Math.abs(G.stackPos(0, 1500, 0, -1)-160)<1e-9 && G.stackPos(5, 2400, 0.3, 1)===G.stackPos(5, 2400, 0.3, 1), "side flips, deterministic");

    // property: 500 seeds of play. Width never below the floor, window >= 400 ms, a perfect is always reachable, no negative height.
    var worst = 1e9, maxW = 0, minW = 1e9, unreachable = 0, perfectsOk = 0, misses = 0;
    for(var s=1;s<=500;s++){

        if(!ok) unreachable++; else perfectsOk++;

        }
        minW = Math.min(minW, r.width); maxW = Math.max(maxW, r.width);
        prevC += r.shift; prevW = r.width; blocks++;
        expect(prevC>=C.center-C.travel-1e-9 && prevC<=C.center+C.travel+1e-9, "target centre left the slider's range: "+prevC);
      }

    expect(minW>=96-1e-9 && maxW<=320+1e-9, "width range "+minW+".."+maxW);

  });

  // Human-like bot on the pure rules (same model as dev/stack-bot.js): beginner / average / strong over 200 seeds each.
  test("Games: Summit Stack is failable for an average player and still winnable for a strong one (noisy bot bands)", async function(){
    var seed = clone(TEMPLATE); seed.settings.ackSafety = Date.now();
    await boot(seed); await goHome();
    var G = W.__cruxGames, C = G.stackConst;
    function gauss(r){ var u = 1-r(), v = r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
    var BANDS = { beginner:{sigma:140,bias:60,lapse:0.08}, average:{sigma:90,bias:25,lapse:0.05}, strong:{sigma:50,bias:0,lapse:0.03} };
    function play(B, sd){
      var r = G.mulberry32(sd*7919+13), t = 0, n = 0, topC = C.center, topW = C.base, tiers = [], score = 0, peak = 0, drops = 0, miss = 0, summit = false, side = r()<0.5 ? -1 : 1;
      while(t<C.roundMs){
        var cross = G.stackCross(n+1); side = -side; var ph = r()*0.5, t0 = t, ideal = t0+C.enterMs;
        for(var x=ideal;x<t0+4*cross;x+=4){ if(Math.abs(C.center+G.stackPos(x-t0, cross, ph, side)-topC)<2) { ideal = x; break; } }
        var tap = r()<B.lapse ? t0+C.enterMs+r()*2*cross : ideal+B.bias+gauss(r)*B.sigma*(1+0.15*t/C.roundMs);
        tap = Math.max(t0+C.enterMs, tap); if(tap>=C.roundMs) break;
        var cx = C.center+G.stackPos(tap-t0, cross, ph, side), res = G.stackDrop(n+1, topW, cx-topC); drops++;
        if(res.miss){ miss++; if(n>0){ var tr = tiers.pop(); n--; score -= tr.pts; var p = tiers[tiers.length-1]; topC = p ? p.c : C.center; topW = p ? p.w : C.base; } t = tap+C.dropMs+C.fallMs; }
        else { var pts = res.perfect ? 2 : 1; tiers.push({ c:topC+res.shift, w:res.width, pts:pts }); topC += res.shift; topW = res.width; n++; score += pts; peak = Math.max(peak, score); if(n>=C.summit) summit = true; t = tap+C.dropMs; }
      }
      return { drops:drops, miss:miss, peak:peak, summit:summit };
    }
    var out = {};
    Object.keys(BANDS).forEach(function(k){
      var d = 0, m = 0, pk = 0, sm = 0, withMiss = 0;
      for(var sd=1;sd<=200;sd++){ var r = play(BANDS[k], sd); d += r.drops; m += r.miss; pk += r.peak; if(r.summit) sm++; if(r.miss>0) withMiss++; }
      out[k] = { keep:1-m/d, peak:pk/200, summit:sm/200, withMiss:withMiss/200, missPerRound:m/200 };
    });
    var info = JSON.stringify(out);
    expect(out.average.missPerRound>=0.5 && out.average.withMiss>=0.4, "the average bot should miss drops: "+info);
    expect(out.beginner.missPerRound>out.average.missPerRound && out.average.missPerRound>out.strong.missPerRound, "misses should fall with skill: "+info);
    expect(out.strong.peak>out.average.peak && out.average.peak>out.beginner.peak, "score should rise with skill: "+info);
    expect(out.strong.summit>=0.8 && out.average.summit>=0.4 && out.average.summit<=0.95 && out.beginner.summit<=0.5, "summit rate ladder: "+info);
    expect(out.beginner.keep>=0.8 && out.average.keep>=0.9, "even the beginner mostly keeps the tower (calm): "+info);
  });

  function setTimerSetting(id, v){ $(id).value = String(v); fire($(id), "input"); }
  function spyAudio(){
    var ctx = W.__cruxSound.ensureAudio(), rec = { osc:0, gains:[] };
    expect(!!ctx, "no audio context in this browser");
    var co = ctx.createOscillator.bind(ctx), cg = ctx.createGain.bind(ctx);
    ctx.createOscillator = function(){ rec.osc++; return co(); };
    ctx.createGain = function(){ var g = cg(), sv = g.gain.setValueAtTime.bind(g.gain);
      g.gain.setValueAtTime = function(v, t){ rec.gains.push(v); return sv(v, t); }; return g; };
    return rec;
  }
  function stubSpeech(){
    var rec = { spoken:[], cancels:0 };
    Object.defineProperty(W, "speechSynthesis", { configurable:true, value:{ speak:function(u){ rec.spoken.push(u && u.text); }, cancel:function(){ rec.cancels++; } } });
    if(!W.SpeechSynthesisUtterance) W.SpeechSynthesisUtterance = function(t){ this.text = t; };
    return rec;
  }
  function stubVibrate(){
    var rec = { n:0 };
    Object.defineProperty(W.navigator, "vibrate", { configurable:true, value:function(){ rec.n++; return true; } });
    return rec;
  }

  // an on-screen picture address -> the asset file it is (the page may show assets/<file> or its uploaded /_blob/<id> copy)
  function fileOf(src){
    var b = /_blob\/([0-9a-f]{32})/.exec(src||"");
    if(!b) return (src||"").replace(/^.*?assets\//, "");
    var m = (SRC.match(/asset\("[^"]+",\s*"[0-9a-f]{32}"\)/g) || []).map(function(c){ return c.match(/asset\("([^"]+)",\s*"([0-9a-f]{32})"\)/); }).filter(function(x){ return x[2]===b[1]; })[0];
    return m ? m[1] : "";
  }

  // ---- Home perch part 2: fallbacks, gesture, travel ----
  function ptr(type, ptype, x, y, id){
    var ev = new W.PointerEvent(type, { bubbles:true, cancelable:true, pointerId:id||1, pointerType:ptype, isPrimary:true, button:0, buttons:type==="pointerup"?0:1, clientX:x, clientY:y });
    $("characterStage").dispatchEvent(ev); return ev;
  }
  function stageCenter(){ var r = $("characterStage").getBoundingClientRect(); return { x:r.left + r.width/2, y:r.top + r.height*0.4 }; }
  async function targetXY(id, env){
    var P = W.__cruxPerch, t = P.targets(env, P.sceneBox()).filter(function(x){ return x.id===id; })[0], r = $("characterScene").getBoundingClientRect();
    return { x:r.left + t.x + t.w/2, y:r.top + t.y + t.h/2, t:t };
  }
  async function until(fn, ms, what){ var t0 = Date.now(); while(!fn() && Date.now()-t0 < (ms||3000)) await wait(20); expect(fn(), "timed out waiting for "+(what||"the state")); }
  async function settleRun(ms){ var t0 = Date.now(); while(W.__cruxPerch.running() && Date.now()-t0 < (ms||5000)) await wait(50); await wait(60); }
  async function dragDrop(ptype, to){ // press the climber, hold past the arm time, move to `to`, release
    var c = stageCenter();
    ptr("pointerdown", ptype, c.x, c.y); await wait(420);
    ptr("pointermove", ptype, to.x, to.y); await wait(30);
    ptr("pointerup", ptype, to.x, to.y);
  }

  // the checks on every target's resolution in the room on screen; tally collects kinds seen
  function checkResolve(P, env, ts, tally){
    var tag = env+"@"+W.innerWidth;
    expect(ts.length>=34, tag+": expected every target");
      ts.forEach(function(t){
        var r = P.resolve(t); tally.kinds[r.kind] = 1;
        expect(/^(hang|sit|stand|reach|beside)$/.test(r.kind), tag+" "+t.id+": bad kind "+r.kind);
        if(t.valid) expect(r.kind===t.kind && r.onTarget, tag+" "+t.id+": a fitting target must keep its own kind, got "+r.kind);
        else expect(r.kind==="reach" || r.kind==="beside", tag+" "+t.id+": an unfitting target must fall back to reach / beside, got "+r.kind);
        if(r.kind==="beside" || r.kind==="reach"){
          expect(Math.abs(r.dy)<0.01, tag+" "+t.id+": a floor pose has to stay on the floor");
          expect(Math.abs(r.dx)<=t.geo.maxX+0.5, tag+" "+t.id+": floor pose outside the room ("+r.dx+" > "+t.geo.maxX+")");
        }
        if(r.kind==="beside") expect(r.facing===1 || r.facing===-1, tag+" "+t.id+": no facing");
        if(r.kind==="reach"){
          tally.reach = true;
          var f = P.frames[r.frame], hx = r.left + f.hand[0]*r.boxW, hy = r.top + f.hand[1]*r.boxH;
          expect(hx>=t.x-0.03*t.geo.W-1 && hx<=t.x+t.w+0.03*t.geo.W+1 && hy>=t.y-0.03*t.geo.H-1 && hy<=t.y+t.h+0.03*t.geo.H+1, tag+" "+t.id+": reach pose's hand isn't near the hold");
          expect(P.check({ topY:r.top+f.minY*r.boxH, feetY:r.top+P.feet*r.boxH, leftX:r.left+f.minX*r.boxW, rightX:r.left+f.maxX*r.boxW, boxH:r.boxH }, t.geo.vis, t.geo.W, t.geo.H)==="", tag+" "+t.id+": reach pose is cropped");
        }
        if(W.innerWidth<500 && (t.id==="stepstool" || t.id==="toolbox")){ expect(r.kind==="sit" && r.s<1, tag+" "+t.id+": a floor-level sit should take a smaller seated climber, got "+r.kind+" s="+r.s); tally.floorSit++; }
        if(W.innerWidth<500 && t.kind==="hang" && !t.valid) expect(r.kind==="beside" || r.kind==="reach", tag+" "+t.id+": a too-low hang falls back to the floor");
      });
      // the floor-reach fallback is for a hold the climber can touch from the floor: a full-size (scale 1) climber on the Slotted Hold
      var sl = ts.filter(function(x){ return x.id==="slottedhold"; })[0];
      if(sl){ var full = Object.assign({}, sl, { s:0.6/P.wanderW }), /* as big as the floor climber was before the perch fixes: his box shrank from 60% to 49% of the stage */ rf = P.resolve(full); expect(/^(reach|beside)$/.test(rf.kind) && rf.s===1, tag+" slottedhold at scale 1: "+rf.kind); if(rf.kind==="reach") tally.reach = true; }
  }

  // sample the climber's drawn size (scale part of the wander transform) every display frame, while `go` runs; [{t, s}]
  async function sampleScale(go, ms){
    var out = [], stop = false, w = $("characterWander"), t0 = W.performance.now();
    (function tick(){ if(stop) return; var tr = W.getComputedStyle(w).transform, m = tr && tr!=="none" ? new W.DOMMatrix(tr) : null; out.push({ t:W.performance.now()-t0, s:m ? Math.hypot(m.a, m.b) : 1, y:m ? m.f : 0 }); W.requestAnimationFrame(tick); })();
    await go(); await wait(ms); stop = true; return out;
  }

  // The size curve of a travel: no step bigger than a smootherstep allows for the observed duration, monotone, at least minMs long. Returns { T, maxStep }.
  function scaleSteps(smp, name, minMs){
    var s0 = smp[0].s, s1 = smp[smp.length-1].s, S = Math.abs(s1-s0), a = -1, z = -1, k;
    expect(S>0.1, name+": the size hardly changed ("+s0.toFixed(3)+" -> "+s1.toFixed(3)+")");
    for(k=0;k<smp.length;k++) if(Math.abs(smp[k].s-s0)>0.003){ a = k; break; }
    for(k=smp.length-1;k>=0;k--) if(Math.abs(smp[k].s-s1)>0.003){ z = k; break; }
    expect(a>0 && z>=a, name+": no size change seen");
    var T = smp[Math.min(smp.length-1, z+1)].t - smp[a-1].t, maxStep = 0, up = s1>s0;
    expect(T>=minMs, name+": the size change took "+Math.round(T)+" ms (wanted at least "+minMs+")");
    for(k=1;k<smp.length;k++){
      var ds = smp[k].s-smp[k-1].s, dt = smp[k].t-smp[k-1].t, allowed = 0.012 + 2.6*S*dt/T;
      maxStep = Math.max(maxStep, Math.abs(ds));
      expect(Math.abs(ds)<=allowed && Math.abs(ds)<=0.05, name+": a jump of "+ds.toFixed(4)+" in "+dt.toFixed(1)+" ms at "+Math.round(smp[k].t)+" ms (allowed "+allowed.toFixed(4)+")");
      expect(up ? ds>=-0.004 : ds<=0.004, name+": the size went the wrong way at "+Math.round(smp[k].t)+" ms");
    }
    return { T:T, maxStep:maxStep, n:smp.length };
  }

  // ---- update app tests ----
  // Stubs stand in for fetch / caches / serviceWorker through window.__cruxUpdEnv (honoured only under __cruxTest).
  function updStubs(o){
    o = o || {};
    var log = { fetched:[], deleted:[], unreg:0, reloads:[], clock:1000000 };
    var etag = o.etag || "v1";
    var env = { force:true, now:function(){ return log.clock; },
      fetch:function(u, opt){ log.fetched.push({ u:String(u), cache:opt&&opt.cache });
        if(o.offline && o.offline()) return Promise.reject(new TypeError("offline"));
        if(/sw\.js/.test(u)) return Promise.resolve({ ok:true, headers:{ get:function(){ return null; } }, text:function(){ return Promise.resolve("// Generated (build abc123def4)"); } });
        return Promise.resolve({ ok:true, headers:{ get:function(h){ return /etag/i.test(h) ? log.etag : null; } }, text:function(){ return Promise.resolve("x"); } }); },
      caches:{ keys:function(){ return Promise.resolve(["crux-files", "crux-fonts"]); }, delete:function(k){ log.deleted.push(k); return Promise.resolve(true); } },
      serviceWorker:{ getRegistrations:function(){ return Promise.resolve([{ unregister:function(){ log.unreg++; return Promise.resolve(true); } }]); } },
      reload:function(u){ log.reloads.push(u); } };
    log.etag = etag; log.env = env;
    return log;
  }
  async function updBoot(o){
    await boot(); var L = updStubs(o); W.__cruxUpdEnv = L.env; var U = W.__cruxUpdate;
    U.st.base = null; U.st.last = 0; U.st.pending = false; U.st.dismissed = false; U.st.busy = false;
    var b = D.getElementById("updateBanner"); if(b) b.remove();
    return { L:L, U:U };
  }

    expect(L.unreg===1, "service worker not unregistered");
    expect(L.reloads.length===1 && /\?v=\d+$/.test(L.reloads[0]), "no cache-busting reload: "+L.reloads.join());
    expect(L.fetched.some(function(f){ return f.cache==="no-store"; }), "network check wasn't no-store");
    expect(STORE[KEY]===before && Object.keys(STORE).sort().join()===keysBefore, "the save or localStorage keys changed");
  });

  test("Update banner: appears when the page's ETag changed, not when it is the same, and never auto-reloads", async function(){

  // ---- end update app tests ----

  /* ---------- runner ---------- */
  var running = false;
  var ONLY = (new URLSearchParams(location.search)).get("only") || "";
  async function runAll(){
    if(running) return; running = true;
    results.length = 0;
    var list = document.getElementById("results"); list.innerHTML = "";
    document.getElementById("summary").textContent = "Running…";
    document.title = "Crux tests: running";
    var realBefore = (function(){ try{ return localStorage.getItem(KEY); }catch(e){ return "unavailable"; } })();
    try{ SRC = await (await fetch("../crux.html", { cache:"no-store" })).text(); }
    catch(e){ document.getElementById("summary").textContent = "Couldn't load ../crux.html: "+e.message; running = false; return; }
    var dup = SRC.toLowerCase().indexOf("<!doctype", 1); if(dup>0) SRC = SRC.slice(dup); // drop a dev server's wrapper
    for(var i=0;i<TESTS.length;i++){
      var t = TESTS[i], li = document.createElement("li");
      if(ONLY && i>0 && t.name.indexOf(ONLY)<0) continue; // dev/tests.html?only=Home perch runs just those (the first test always runs: it makes the fresh-install save)
      li.className = "run"; li.innerHTML = '<span class="tag">…</span> <span class="name"></span><div class="detail"></div>';
      li.querySelector(".name").textContent = t.name; list.appendChild(li);
      window.__appErrors.length = 0;
      window.__fakeClaude = null; // tests that need Claude set a stand-in themselves
      var r = { name:t.name, status:"pass", detail:"" };
      try{
        if(!TEMPLATE && i>0) throw new Error("skipped: the first test didn't produce a fresh-install save");
        await t.fn();
        if(window.__appErrors.length) throw new Error("app errors:\n"+window.__appErrors.slice(0, 5).join("\n"));
      }catch(e){ r.status = e.warn ? "warn" : "fail"; r.detail = e.message; }
      results.push(r);
      li.className = r.status; li.querySelector(".tag").textContent = r.status==="pass" ? "PASS" : r.status==="warn" ? "WARN" : "FAIL";
      li.querySelector(".detail").textContent = r.detail;
    }
    var realAfter = (function(){ try{ return localStorage.getItem(KEY); }catch(e){ return "unavailable"; } })();
    // Belt and braces: if the stand-in ever failed, put the real save back exactly as it was.
    if(realAfter!==realBefore && realBefore!=="unavailable"){ try{ if(realBefore===null) localStorage.removeItem(KEY); else localStorage.setItem(KEY, realBefore); }catch(e){} }
    results.push({ name:"Your real save in this browser was not touched", status: realAfter===realBefore ? "pass" : "fail", detail: realAfter===realBefore ? "" : "the real "+KEY+" changed during the run" });
    var last = results[results.length-1], li2 = document.createElement("li");
    li2.className = last.status; li2.innerHTML = '<span class="tag">'+(last.status==="pass"?"PASS":"FAIL")+'</span> <span class="name"></span><div class="detail"></div>';
    li2.querySelector(".name").textContent = last.name; li2.querySelector(".detail").textContent = last.detail; list.appendChild(li2);
    var fails = results.filter(function(r){ return r.status==="fail"; }).length, warns = results.filter(function(r){ return r.status==="warn"; }).length;
    var text = fails ? fails+" FAILED of "+results.length : "All "+(results.length-warns)+" checks passed"+(warns ? " · "+warns+" warning"+(warns>1?"s":"") : "");
    document.getElementById("summary").textContent = text;
    document.title = "Crux tests: "+(fails ? "FAIL" : "PASS")+" ("+text+")";
    window.cruxTestsDone = true; running = false;
  }
  document.getElementById("runBtn").addEventListener("click", runAll);
  runAll();
})();
